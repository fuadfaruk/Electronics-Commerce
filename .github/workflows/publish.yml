name: Build, publish and deploy electroapi.api

on:
  push:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore electroapi.api for Windows deployment
        run: dotnet restore backend/src/electroapi.api/electroapi.api.csproj -r win-x86

      - name: Build electroapi.api
        run: dotnet build backend/src/electroapi.api/electroapi.api.csproj --configuration Release --no-restore

      - name: Test backend
        run: dotnet test backend/electro-api.slnx --configuration Release

      - name: Publish electroapi.api
        run: dotnet publish backend/src/electroapi.api/electroapi.api.csproj --configuration Release --runtime win-x86 --output ./publish/electroapi.api --no-restore --no-build

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: electroapi.api
          path: ./publish/electroapi.api

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: ./publish/electroapi.api
