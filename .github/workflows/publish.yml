name: Build, publish and deploy electroapi.api

on:
  push:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend for Windows deployment
        run: dotnet restore backend/electro-api.slnx --runtime win-x64

      - name: Build electroapi.api
        run: dotnet build backend/src/electroapi.api/electroapi.api.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Test backend
        run: dotnet test backend/electro-api.slnx --configuration Release --no-restore

      - name: Publish electroapi.api
        run: dotnet publish backend/src/electroapi.api/electroapi.api.csproj --configuration Release --runtime win-x64 --output ./publish/electroapi.api --no-restore --no-build

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: electroapi.api
          path: ./publish/electroapi.api

      - name: Check deployment secrets
        shell: pwsh
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          Write-Host "WEBSITE_NAME present: $(-not [string]::IsNullOrEmpty($env:WEBSITE_NAME))"
          Write-Host "SERVER_COMPUTER_NAME present: $(-not [string]::IsNullOrEmpty($env:SERVER_COMPUTER_NAME))"
          Write-Host "SERVER_USERNAME present: $(-not [string]::IsNullOrEmpty($env:SERVER_USERNAME))"
          Write-Host "SERVER_PASSWORD present: $(-not [string]::IsNullOrEmpty($env:SERVER_PASSWORD))"

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: ./publish/electroapi.api
